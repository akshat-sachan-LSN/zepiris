# GPU overlay — apply on top of docker-compose.yml on an NVIDIA instance
# (g4dn.xlarge / T4 and up):
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Requires on the host: NVIDIA driver (nvidia-smi works) and the NVIDIA container
# toolkit (`docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04
# nvidia-smi` works). See docs/CPU_VS_GPU.md §5.
name: zepiris

services:
  ml-inference:
    build:
      args:
        # CUDA 12 / cuDNN 9 build of ONNX Runtime. 1.29+ moved to CUDA 13, which
        # needs a 580-series driver; 1.23.2 runs on the 550/570 drivers the AL2023
        # and Deep Learning AMIs ship. The [cuda,cudnn] extras bring the CUDA
        # libraries as pip wheels, so no CUDA toolkit is needed in the image.
        ONNXRUNTIME_GPU_VERSION: "1.23.2"
    # Multiple worker processes, because one is not enough — and on GPU the
    # reason is the host, not the card.
    #
    # Measured on g4dn.xlarge (4 vCPU, T4): a single ML process plateaus at ~190%
    # CPU and ~34.5 req/s while the T4 draws 27 W of 70 W. That 190% is the GIL:
    # one core running Python, plus roughly one more from OpenCV and ONNX Runtime
    # releasing it during native work. Per-request cost on GPU is almost all
    # CPU-side — JPEG decode, resize, letterbox, normalize, crop — so the limit is
    # Python throughput, not inference. A bigger instance cannot fix that; one
    # process cannot use more cores. More processes can.
    #
    # 3 on a 4-vCPU host leaves a core for the API and the event loops. Each
    # worker loads its own copy of the models into GPU memory (~1.4 GB), so 3 is
    # ~4.2 GB of the T4's 15 GB — and each warms up at startup, so boot is slower.
    command:
      - python
      - -m
      - uvicorn
      - zepiris.ml_inference.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --workers
      - "3"
    # The NVIDIA container runtime injects the host's driver libraries at startup
    # and rewrites /etc/ld.so.cache to make them findable, which a read-only
    # rootfs refuses. /tmp stays tmpfs, so nothing the service writes persists.
    read_only: false
    environment:
      ML_SERVICE_ML_DEVICE: "cuda"
      # balanced, not accurate: the two tiers share the SAME recognizer
      # (w600k_r50), so match scores and thresholds are unchanged — the only
      # difference is the detector. Measured on a T4: accurate (det_10g @512)
      # capped at 34.5 req/s with the host pinned at 380% CPU, because SCRFD's
      # anchor decoding and NMS run in numpy on the CPU and det_10g emits far
      # more anchors. balanced (det_500m @320) reached 98.9 req/s at p99 273ms on
      # the same box. The detector, not the recognizer, is what sizes a GPU host.
      ML_SERVICE_FACE_TIER: "balanced"
      # A selfie face fills the frame and detects fine at 320; document faces are
      # the case that needs 512+, and this branch is facematch-only.
      ML_SERVICE_FACE_DETECTION_WIDTH: "320"
      ML_SERVICE_FACE_DETECTION_HEIGHT: "320"
      # Per worker, so with 3 workers the instance runs ~36 inferences at once.
      # This is a queue-depth control, not a throughput knob: concurrency past
      # what the hardware can actually retire adds only waiting. At the measured
      # ~35 req/s and ~1s service time, useful in-flight work is ~35 requests
      # (Little's law) — 36 covers it, while the old 32-per-worker meant 96 in
      # flight, of which ~60 would have been queueing inside the process and
      # making every other request slower through CPU contention.
      ML_SERVICE_MAX_CONCURRENT_INFERENCES: "12"
      # 10s to wait for a slot, then 503. This is the promise the service makes
      # about queueing: a request either starts within 10s or is refused, so
      # overload costs the requests that cannot be served rather than delaying
      # every request behind them. Measured at 30s, the queue absorbed 200 req/s
      # by answering at up to 27.6s with nothing shed — served, but long after the
      # caller had gone. Keep the API's own budget
      # (ZEPIRIS_ML_INFERENCE_TIMEOUT_SECONDS, 60s) above this, or the API gives
      # up before the ML service sheds.
      ML_SERVICE_INFERENCE_QUEUE_TIMEOUT_SECONDS: "10"
      # Parallel pair embedding fans one request's two sides across CPU workers.
      # Off here: with 3 GIL-bound worker processes already competing for 4 cores,
      # fanning out inside a request steals throughput from other requests to
      # help one. Worth re-testing once the process count is settled.
      ML_SERVICE_FACE_PARALLEL_PAIR_EMBED: "false"

      # -----------------------------------------------------------------------
      # Throughput tuning (tasks 1-4 in the optimisation pass)
      # -----------------------------------------------------------------------

      # Cap the input side fed to the detector.  With a 320-px or 256-px
      # detector window, carrying 1600-px intermediates is pure wasted resize
      # work — the detector letterboxes to its window regardless.  640 keeps the
      # face comfortably above the 112-px recognition crop at any normal phone
      # focal length while cutting pre-detection work significantly.
      ML_SERVICE_FACE_MAX_INPUT_SIDE: "640"

      # Reference-embedding cache.  4096 (the default) is enough for a small
      # pilot but will thrash in production with thousands of distinct riders.
      # 16384 entries × 2 KB = ~32 MB — a rounding error against the 1.4 GB
      # model footprint per worker, and it keeps the hit rate above 0.9 once
      # the working set stabilises.
      ML_SERVICE_FACE_REFERENCE_CACHE_SIZE: "16384"

      # libjpeg native half-size decode.  Tells libjpeg to compute the DCT at
      # 1/2 resolution, not decode full-res and then resize down.  CPU work
      # drops ~25% per decode.  Safe at 640-px input cap + 320-px detector:
      # a 1080p selfie decodes to 540p, which is still 4× the recognition crop.
      # Validate first with scripts/prod_replay.py if input sizes vary widely.
      ML_SERVICE_FACE_JPEG_DECODE_REDUCTION: "2"

      # -----------------------------------------------------------------------
      # FP16 model overrides — DISABLED until convert_fp16.py has been run.
      #
      # On the T4 (8.1 TFLOPS FP32 vs 65 TFLOPS FP16 tensor cores) this is the
      # single largest throughput lever: the GPU switches from CUDA cores to
      # tensor cores and inference cost drops ~2-3×.
      #
      # Step 1 — generate the FP16 models into the mounted model volume. Convert
      # the tier this overlay actually deploys (balanced = buffalo_s detector +
      # buffalo_l recognizer), not the accurate tier's det_10g:
      #   docker run --rm -v zepiris_insightface_cache:/home/appuser/.insightface \
      #     -v ~/zepiris:/src -w /src --entrypoint bash zepiris-ml-inference \
      #     -c "pip install -q onnxconverter-common && python scripts/convert_fp16.py"
      #
      # Step 2 — uncomment the two lines below (they already name the paths the
      # script writes for the balanced tier) and redeploy:
      #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
      #
      # Step 3 — validate before promoting. FP16 rounding near a 0.5 threshold is
      # the only real risk, and prod_replay measures exactly that: |dscore| against
      # the recorded scores, with no verdict allowed to flip.
      #   python scripts/prod_replay.py --base-url http://<host>:8000 --rows 400
      #
      # Paths are under /home/appuser — the container runs as appuser and the
      # volume is mounted on its home, so /root/.insightface does not exist here.
      # A path that does not resolve makes the engine fall back to stock
      # FaceAnalysis with only a warning, so a typo costs accuracy silently.
      # -----------------------------------------------------------------------
      # ML_SERVICE_FACE_DET_MODEL_PATH: "/home/appuser/.insightface/models/buffalo_s/det_500m_fp16.onnx"
      # ML_SERVICE_FACE_REC_MODEL_PATH: "/home/appuser/.insightface/models/buffalo_l/w600k_r50_fp16.onnx"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
